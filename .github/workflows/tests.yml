# Constat d'audit 4 : aucune CI ne rejouait la suite, et rien ne figeait les
# dependances. Ce workflow fait les deux — install epinglee + suite complete.
name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installer les dependances epinglees
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Gabarit OCTO (depot public VSCode2, pas de copie ici)
        # Constat d'audit 7 (2026-09-23) : sans gabarit, test_generation_decks
        # etait SAUTE et les generateurs a 0 %. On le telecharge depuis le depot
        # public VSCode2 plutot que de le recopier dans ce depot.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: claudecamus-dot/VsCode2
          ref: fcf0fd65b3b9bdfa853b4b6a4b1a97b1420a11a6
          path: _vscode2
          sparse-checkout: app/assets/template-octo.pptx
          sparse-checkout-cone-mode: false
      - name: Exposer le gabarit aux generateurs
        run: echo "TEMPLATE_OCTO_PATH=$GITHUB_WORKSPACE/_vscode2/app/assets/template-octo.pptx" >> "$GITHUB_ENV"
      - name: Suite de tests avec couverture
        # Aucun test n'ouvre de socket ni ne demande de credential Trello :
        # la session HTTP est doublee (voir tests/).
        # --cov etendu a docs/run-ia (constat d'audit 8) : avant, seul
        # trello_client etait mesure alors que les generateurs pesent ~2/3
        # du code applicatif. Sur cette CI ubuntu le gabarit OCTO est absent
        # (chemin hors depot, constat d'audit 7), donc test_generation_decks
        # est SAUTE et ce module reste a 0% mesure explicitement au lieu
        # d'etre absent du rapport : le trou reste visible plutot que tu.
        run: python -m pytest tests/ -q --cov=trello_client --cov="docs/run-ia" --cov-report=term-missing
